name: Repair stuck GitHub Pages deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          STUCK_DEPLOYMENT: 76a1744670339f24b5d910a4ed49a1972433307d
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/pages/deployments/${STUCK_DEPLOYMENT}/cancel"

      - name: Wait for cancellation to settle
        run: sleep 10

      - name: Request a fresh Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/pages/builds"
